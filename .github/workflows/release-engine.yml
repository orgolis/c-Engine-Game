# ============================================================================
# Release the engine package that the GameWorldshaper Hub installs.
#
# On a version tag (v*), this builds the editor with the project's toolchain
# (MinGW g++ + Ninja + Vulkan SDK), runs `cpack -G ZIP` to produce a flat engine
# package (editor.exe + runtime DLLs + default content at the root), and uploads
# it as an asset on the GitHub Release for the tag. The Hub's "Check for Updates"
# reads these releases and installs the asset.
#
# NOTE: this is the correct SHAPE of the pipeline, but the engine's native build
# is toolchain-sensitive (Jolt / tinyusdz / glslang, plus MinGW-specific
# tweaks). Expect to validate/iterate the toolchain + Vulkan-SDK steps on the
# first real run — CI has never built this tree.
# ============================================================================
name: Release Engine

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write          # needed to create/attach release assets

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}   # MinGW g++/ninja live in the MSYS2 environment

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # tinyusdz, ufbx, etc.

      - name: Set up MinGW toolchain (g++, ninja, cmake)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Install the Vulkan SDK
        shell: pwsh    # this action runs in PowerShell, not MSYS2
        # Any maintained Vulkan-SDK installer action works; pin a version that
        # matches what the engine expects (find_package(Vulkan)).
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.341.1
          install_runtime: true
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DBUILD_TESTS=OFF

      - name: Build editor
        run: cmake --build build --target editor -j

      - name: Package the engine (CPack ZIP)
        run: cd build && cpack -G ZIP

      - name: Rename asset to include the version
        run: |
          mkdir -p dist
          cp build/GameWorldshaper-Engine-*.zip "dist/engine-${GITHUB_REF_NAME}-win64.zip"
          ls -la dist

      - name: Upload to the GitHub Release
        shell: pwsh
        uses: softprops/action-gh-release@v2
        with:
          files: dist/engine-*-win64.zip
          fail_on_unmatched_files: true
