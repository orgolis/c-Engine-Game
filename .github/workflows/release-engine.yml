# ============================================================================
# Release the engine package that the GameWorldshaper Hub installs.
#
# On a version tag (v*), this builds the editor with the project's toolchain
# (MinGW g++ + Ninja + Vulkan SDK), runs `cpack -G ZIP` to produce a flat engine
# package (editor.exe + runtime DLLs + default content at the root), and uploads
# it as an asset on the GitHub Release for the tag. The Hub's "Check for Updates"
# reads these releases and installs the asset.
#
# NOTE: this is the correct SHAPE of the pipeline, but the engine's native build
# is toolchain-sensitive (Jolt / tinyusdz / glslang, plus MinGW-specific
# tweaks). Expect to validate/iterate the toolchain + Vulkan-SDK steps on the
# first real run — CI has never built this tree.
# ============================================================================
name: Release Engine

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write          # needed to create/attach release assets

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}   # MinGW g++/ninja live in the MSYS2 environment

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # tinyusdz, ufbx, etc.

      - name: Set up MinGW toolchain (g++, ninja, cmake)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            zip

      - name: Install the Vulkan SDK
        # Any maintained Vulkan-SDK installer action works; pin a version that
        # matches what the engine expects (find_package(Vulkan)). No `shell:` here
        # — it's invalid on a `uses:` step (this action runs on its own).
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.341.1
          install_runtime: true
          cache: true

      - name: Configure
        # -g is appended to the Release flags (CMAKE_CXX_FLAGS is prepended to
        # CMAKE_CXX_FLAGS_RELEASE), so the build tree carries DWARF while the
        # optimisation level stays exactly -O3 -DNDEBUG. The SHIPPED binary is
        # unaffected: CPACK_STRIP_FILES strips the packaged copy, so users still
        # download the same ~15 MB editor.exe. The unstripped build-tree copy is
        # uploaded separately as the symbols asset below.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-g -DCMAKE_CXX_FLAGS=-g \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DBUILD_TESTS=OFF

      - name: Build the editor and the shipped command line
        # Must build everything the package installs. Building only `editor`
        # made CPack fail with "file INSTALL cannot find" once the CLI was
        # added to the engine component — the binaries simply did not exist.
        # A local `cpack` did not catch it because a dev tree already has
        # them built; only a from-scratch build exposes the gap.
        run: cmake --build build -j --target editor gws headless projectctl docgen assetcook

      - name: Package the engine (CPack ZIP)
        run: cd build && cpack -G ZIP

      - name: Collect debug symbols
        # gws_diagnostics writes crash stacks as module + RVA, which can only be
        # resolved against the SAME-VERSION UNSTRIPPED build. Without this asset a
        # crash report from a release is unsymbolizable — the crash reporter is
        # only half-useful. Keep these for as long as the release is supported.
        run: |
          mkdir -p symbols
          cp build/bin/*.exe symbols/ 2>/dev/null || true
          cp build/bin/*.dll symbols/ 2>/dev/null || true
          {
            echo "GameWorldshaper engine symbols"
            echo "tag:        ${GITHUB_REF_NAME}"
            echo "commit:     ${GITHUB_SHA}"
            echo "built:      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "toolchain:  $(g++ --version | head -1)"
            echo ""
            echo "These binaries are UNSTRIPPED and match the stripped ones in the"
            echo "engine package for this exact tag. To resolve a crash report:"
            echo ""
            echo "  addr2line -f -C -e <module-from-report> <RVA-from-report>"
            echo ""
            echo "The module name and RVA are printed in the crash report written to"
            echo "%LOCALAPPDATA%/GameWorldshaper/diagnostics/."
          } > symbols/BUILDINFO.txt
          ls -la symbols

      - name: Rename assets to include the version
        run: |
          mkdir -p dist
          cp build/GameWorldshaper-Engine-*.zip "dist/engine-${GITHUB_REF_NAME}-win64.zip"
          # CRITICAL: the symbols archive must NOT be a .zip.
          #
          # The Hub selects a release asset by substring match, defaulting to
          # ".zip", and takes the FIRST match. GitHub returns assets sorted by
          # name, and "engine-<tag>-win64-symbols.zip" sorts BEFORE
          # "engine-<tag>-win64.zip" — so every Hub already installed in the
          # wild would have downloaded 63 MB of unstripped binaries and
          # installed them as the engine. Older Hubs cannot be fixed
          # retroactively, so the asset must not match ".zip" at all.
          tar -czf "dist/engine-${GITHUB_REF_NAME}-win64-symbols.tar.gz" -C symbols .
          ls -la dist

      - name: Upload to the GitHub Release
        uses: softprops/action-gh-release@v2   # NOTE: no `shell:` — it's invalid on a `uses:` step
        with:
          files: |
            dist/engine-*-win64.zip
            dist/engine-*-win64-symbols.tar.gz
          fail_on_unmatched_files: true
