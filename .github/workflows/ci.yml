# ============================================================================
# Continuous integration — build the tree and run the headless check suite.
#
# WHY THIS EXISTS: `release-engine.yml` only triggers on `v*` tags, so nothing
# validated the tree between releases. That blind spot let a broken clean clone
# survive twenty consecutive releases (see issue #2). This workflow runs on
# every pull request and every push to main, so breakage surfaces immediately
# instead of at release time.
#
# It builds with the project's canonical toolchain (MinGW-UCRT g++ + Ninja +
# Vulkan SDK) rather than the pinned absolute paths in CMakePresets.json, which
# point at a local Strawberry install that does not exist on a runner.
#
# NOTE for editors of this file: never put `shell:` on a `uses:` step. That is
# invalid and fails the run in 0s — it has bitten this repo twice before.
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}   # g++/ninja/cmake live in the MSYS2 environment

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive   # JoltPhysics, enet, tinyusdz, ufbx, ...

      - name: Set up MinGW toolchain (g++, ninja, cmake)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64        # matches the local toolchain's UCRT runtime
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Install the Vulkan SDK
        # Required even for the headless checks: the root CMakeLists calls
        # find_package(Vulkan REQUIRED), so configure fails without it.
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.341.1
          install_runtime: true
          cache: true

      - name: Report toolchain versions
        run: |
          g++ --version | head -1
          cmake --version | head -1
          ninja --version
          echo "VULKAN_SDK=${VULKAN_SDK}"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build the check suite
        # `editor` is built too, even though CI cannot run it. Without it CI
        # covers only what the checks link, and the legacy pre-ECS libraries
        # (engine/core/{gameplay,ability,character}) are linked by NOTHING else —
        # so a compile break there sailed past a green CI run and only failed at
        # release time. Building the editor closes that hole.
        run: |
          cmake --build build -j $(nproc) --target \
            gameplay_check physics_check net_check repl_check server_check \
            mp_check prediction_check audio_check profiler_check texture_check \
            model_check anim_check skinning_check skinned_import_check \
            ai_check ui_check world_check combat_check vfx_check crash_check \
            script_check assetcook dedicated_server editor gws

      - name: Run the check suite
        # Driven through `gws test` rather than a shell loop. The tool owns
        # which checks exist (it discovers them), which need a GPU, and what a
        # result means - so CI, a developer's terminal and an AI agent all get
        # identical behaviour instead of three copies of the same list drifting
        # apart. This is the Phase 1 exit criterion: CI runs the suite through
        # the CLI. See issue #7.
        run: |
          set -o pipefail
          # script_check's C# backend shells out to `dotnet`, present on the
          # runner but not on the MSYS2 shell's PATH.
          export PATH="${PATH}:/c/Program Files/dotnet"
          # No --gpu: texture/model/skinning_check need a Vulkan device and
          # runners have no GPU or ICD, so `gws test` skips them and says so.
          # Tracked by #63.
          ./build/bin/gws.exe test | tee check-output.txt
          rc=$?
          {
            echo "### Check suite"
            echo ""
            echo '```'
            tail -n 1 check-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^FAIL' check-output.txt | while read -r _ name rest; do
            echo "::error title=${name}::${rest}"
          done
          exit $rc

      - name: Upload crash-report artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            build/bin/*.log
            ${{ env.LOCALAPPDATA }}/GameWorldshaper/diagnostics/**
          if-no-files-found: ignore
          retention-days: 7
